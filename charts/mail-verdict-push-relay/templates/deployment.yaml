apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail-verdict-push-relay.fullname" . }}
  labels:
    {{- include "mail-verdict-push-relay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mail-verdict-push-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mail-verdict-push-relay.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mail-verdict-push-relay
          image: "{{ .Values.image.repository }}:{{ include "mail-verdict-push-relay.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "mail-verdict-push-relay.fullname" . }}-config
          env:
            - name: TICKET_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tickets.existingSecret }}
                  key: {{ .Values.tickets.existingSecretKey }}
          volumeMounts:
            - name: apns-key
              mountPath: /secrets/apns
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: apns-key
          secret:
            secretName: {{ .Values.apns.authKey.existingSecret }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
