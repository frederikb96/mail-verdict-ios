name: Free checks

# Everything that does not require Apple hardware, on a GitHub-hosted Linux runner.
#
# This is where nearly all of the real checking happens. The package — every model, the
# networking layer and its tests — compiles and runs here in a couple of minutes; a Mac run takes
# ten to thirty and has to queue for a scarcer machine, so anything that can be proven here should
# be.
#
# Keep it that way when adding code: prefer a shape that builds on Linux, and guard an Apple-only
# import rather than letting it pull the whole package onto a Mac.
#
# 🚨 **Linux runs here, never on a self-hosted runner.** A `pull_request` trigger runs the
# workflow file as it exists on the pull request's own head, so on a public repository a stranger
# can rewrite this file and execute what they like on whatever machine it names. A self-hosted
# runner is a machine inside the cluster; a GitHub-hosted one is a throwaway VM that can reach
# nothing. Standard Linux and macOS runners are unmetered for public repositories, so there is
# nothing to buy back by hosting this ourselves.
#
# Both jobs run in the official Swift image, pinned to an exact release. Swift 6.2.1 — the newest
# release `swift-actions/setup-swift` knows — ships a `libswiftObservation.so` with an undefined
# reference to `swift::threading::fatal`, and a test binary that links both Observation and C++
# (swift-crypto's vendored BoringSSL) fails to link against it. 6.2.4's does not carry that
# reference. Bump the tag deliberately; a floating one would pick up the next such regression
# unannounced.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # contract-drift only — mail-verdict's own API contract moving is never something a push or PR
  # here caused, so there is nothing for those two triggers to react to.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Inside a `container:` job `run:` defaults to `sh`, which has no `pipefail`.
defaults:
  run:
    shell: bash

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: swift:6.2.4-noble
    timeout-minutes: 30

    steps:
      # The image carries the toolchain and everything it needs at run time. These are what the
      # steps below use on top of that: git for the checkout and SwiftPM's dependency clones,
      # python3 for the Swift 6 scan, zstd for the cache.
      - name: Install job tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git python3 zstd

      - uses: actions/checkout@v7

      # The workspace belongs to the runner's user and the container runs as root, so git refuses
      # it as unsafe in every later step; checkout only marks it safe for its own commands.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Part of the cache key, so a `.build` produced by a different compiler is never restored
      # into this one — its module files would be rejected, or worse, half-reused.
      - name: Read the toolchain version
        id: toolchain
        run: echo "version=$(swift --version 2>/dev/null | head -1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      # Dependencies are fetched and rebuilt on every run otherwise, which is most of the wall
      # time here. Keyed on the manifest so a dependency change invalidates it.
      - uses: actions/cache@v4
        with:
          path: MailVerdictKit/.build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('MailVerdictKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-

      - name: Build and test the package
        run: |
          set -o pipefail
          swift build --package-path MailVerdictKit --build-tests 2>&1 | tee /tmp/build.log
          swift test --package-path MailVerdictKit --skip-build

      # A hand-written "covers every ContractModel" list drifts the moment a model is added
      # without being registered — this derives the real list from the source and diffs it.
      - name: Check the contract model registry is complete
        run: ./Tooling/check-contract-registry.sh

      # The only check that reaches the app target and the Linux-excluded package files, which
      # nothing else here compiles. See the script's header for what it can and cannot catch.
      - name: Syntax-check what Linux cannot compile
        run: ./Tooling/parse-swift.sh

      # Everything past syntax that the app target would otherwise only fail on a macOS runner
      # billed at ten times this one. Each pattern it knows has cost a real build.
      - name: Scan for Swift 6 shapes only a Mac would reject
        run: ./Tooling/swift6-lint.py

      - name: Format
        run: swift format lint --recursive --strict MailVerdictKit MailVerdict MailVerdictNotify

      # Compiler errors sit far above the last lines of a long build, so a truncated log leaves a
      # failure reporting nothing but an exit code.
      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # swift-format can fix everything it reports, but neither peer has a Swift toolchain to run
      # it on. Publishing the correction means a formatting failure is resolved with
      # `gh run download` and `git apply` rather than by hand-editing from line numbers.
      - name: Publish the formatting correction as a patch
        if: failure()
        run: |
          swift format --in-place --recursive MailVerdictKit MailVerdict MailVerdictNotify
          git diff > format.patch

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: format-patch
          path: format.patch
          retention-days: 5

  # Red here means mail-verdict's own API moved since the vendored snapshot was last synced —
  # never on a push or PR to this repo, which cannot itself cause that. Re-run with
  # `Tooling/sync-contract.sh <new-sha>` and update the model(s) ContractTests names.
  contract-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:6.2.4-noble
    timeout-minutes: 15

    steps:
      - name: Install job tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v7

      # The workspace belongs to the runner's user and the container runs as root, so git refuses
      # it as unsafe in every later step; checkout only marks it safe for its own commands.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch mail-verdict main's own contract snapshot over the vendored one
        run: |
          dest=MailVerdictKit/Tests/MailVerdictKitTests/Fixtures/api-contract
          base=https://raw.githubusercontent.com/frederikb96/mail-verdict/main/docs/api-contract
          curl -fsSL "$base/openapi.json" -o "$dest/openapi.json"
          curl -fsSL "$base/sse-events.json" -o "$dest/sse-events.json"

      - name: Run ContractTests against mail-verdict main
        run: swift test --package-path MailVerdictKit --filter ContractTests
