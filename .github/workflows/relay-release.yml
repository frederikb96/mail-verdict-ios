name: Relay release

# Tag-triggered publish of the two things a chart install needs: the container image and the
# chart itself, both on GHCR (public, so an install needs no pull secret or repo add) — never
# vendored into any cluster repo that consumes it.
#
# Tag prefix is scoped to this component (`relay-v*.*.*`), distinct from the app's own `v*.*.*`
# release tags, since the two are versioned and released independently in one repo.
on:
  push:
    tags:
      - 'relay-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test ./...

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with: { version: v3.17.0 }
      - run: helm lint charts/mail-verdict-push-relay

  release-helm:
    runs-on: ubuntu-latest
    needs: [go, helm-lint]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with: { version: v3.17.0 }

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package charts/mail-verdict-push-relay --destination dist
          helm push dist/mail-verdict-push-relay-*.tgz oci://ghcr.io/frederikb96/charts

  build-image:
    runs-on: ubuntu-latest
    needs: [go, helm-lint]
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: ver
        run: |
          version=${GITHUB_REF#refs/tags/relay-v}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/mail-verdict-push-relay:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mail-verdict-push-relay:latest

      # A freshly-pushed GHCR package defaults to PRIVATE regardless of the repository's own
      # visibility, and GITHUB_TOKEN has no documented, reliable way to flip that itself — doing
      # it here would be an unverified API call standing in for a real check. This is a one-time
      # step, not a per-release one: once the package is public, every later push to the same
      # tag stays public. See the chart README's install section for the manual step (package
      # Settings → Change visibility) required after the very first run of this job.
