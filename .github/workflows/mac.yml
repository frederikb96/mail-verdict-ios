name: Mac

# Everything that genuinely needs Apple hardware — building the app target, and running it in a
# simulator to see what it draws.
#
# 🚨 **Not triggered by pushes to main, deliberately.** A Mac run takes ten to thirty minutes and
# queues for a scarcer machine, so firing one on every commit buries the answer you wanted under
# twenty you did not. Work on a branch, then ask for one run when there is something worth
# looking at — `gh workflow run mac.yml` — or open a pull request. Batch the questions into that
# one run rather than spending several to answer them one at a time.
#
# `Tooling/sim/` holds the simulator lane, so the same scripts run here and on any other Mac.
# On pull requests only the compile and the built-bundle assertions run. The simulator lane (boot,
# screenshots, debug bridge) runs on manual dispatch with `run_app`; `release.yml` calls this
# without it, so the compile and the bundle assertions gate every upload.
on:
  # Called from `free-checks.yml` on pull requests that change the app (concurrency is set there)
  # and from `release.yml`.
  workflow_call:
    inputs:
      run_app:
        type: boolean
        default: false
      # Checked out instead of the calling ref when set (a release refresh rebuilds an old tag).
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_app:
        description: 'Boot a simulator and run the app (slower; skip for a compile-only check)'
        type: boolean
        default: true
      configuration:
        description: 'Build configuration. Release before a release — DEBUG-only code compiles out, and that error surfaces nowhere else.'
        type: choice
        options: [Debug, Release]
        default: Debug
      appearance:
        description: 'Simulator appearance for the fixture screenshot sweep'
        type: choice
        options: [dark, light]
        default: dark
      content_size:
        description: 'Dynamic Type size for the fixture screenshot sweep'
        type: choice
        options: [default, accessibility-large]
        default: default
      only:
        description: 'Comma-separated screen ids from Tooling/sim/sweep.sh; empty runs all, none only the plain launch'
        type: string
        default: ''
      script:
        description: 'Repo path of a probe sourced after the sweep'
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/cache/restore@v6
        id: xcode-cache
        with:
          path: |
            build/dd/SourcePackages
            build/dd/CompilationCache.noindex
          key: xcode-${{ runner.os }}-${{ hashFiles('MailVerdictKit/Package.swift', 'MailVerdict.xcodeproj/project.pbxproj') }}-${{ github.run_id }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('MailVerdictKit/Package.swift', 'MailVerdict.xcodeproj/project.pbxproj') }}-
            xcode-${{ runner.os }}-

      # A boot is minutes of waiting, not of work, so it overlaps the build.
      - name: Start a simulator
        id: sim
        if: inputs.run_app
        run: echo "udid=$(Tooling/sim/boot.sh start)" >> "$GITHUB_OUTPUT"

      # Everything else in the package is already green from free-checks, so this builds only the
      # app target — the part that needs an iOS SDK.
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project MailVerdict.xcodeproj -scheme MailVerdict \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" -derivedDataPath build/dd \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log | tail -20

      # Saved here rather than at the end of the job, so a red sweep keeps what the build produced.
      - uses: actions/cache/save@v6
        with:
          path: |
            build/dd/SourcePackages
            build/dd/CompilationCache.noindex
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # Catches a dropped `INFOPLIST_FILE` merge or a missing `ASSETCATALOG_COMPILER_APPICON_NAME`
      # before either ships: both fail silently on a device rather than at build time, so asserting
      # against the actual built bundle is the only way to know.
      - name: The built bundle declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          plutil -p "$app/Info.plist" > /tmp/built-info.txt
          grep -q '"CFBundleIconName"' /tmp/built-info.txt \
            || { echo '::error::CFBundleIconName is missing — ASSETCATALOG_COMPILER_APPICON_NAME or the asset catalog is wrong'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'ITSAppUsesNonExemptEncryption' /tmp/built-info.txt \
            || { echo '::error::ITSAppUsesNonExemptEncryption is missing — a submission would otherwise be asked about export compliance every time'; \
                 cat /tmp/built-info.txt; exit 1; }
          echo 'app icon and encryption declaration both present'

      # The extension is a separate target, embedded by its own copy phase — a dropped embed, a
      # mismatched version or an empty CFBundleDisplayName all install as an opaque "Unable to
      # Install" on the phone, with no build-time error otherwise.
      - name: The notification extension is embedded and declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          appex="$app/PlugIns/MailVerdictNotify.appex"
          [ -d "$appex" ] \
            || { echo '::error::MailVerdictNotify.appex is not embedded in PlugIns/ — check the copy phase and the target dependency'; exit 1; }

          grep -q 'UIBackgroundModes' /tmp/built-info.txt \
            || { echo '::error::app Info.plist has no UIBackgroundModes — silent pushes never reach the app'; cat /tmp/built-info.txt; exit 1; }
          grep -q 'remote-notification' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes does not contain remote-notification'; cat /tmp/built-info.txt; exit 1; }

          plutil -p "$appex/Info.plist" > /tmp/appex-info.txt
          fail=0

          display_name=$(plutil -extract CFBundleDisplayName raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ -n "$display_name" ] \
            || { echo '::error::MailVerdictNotify CFBundleDisplayName is empty — fails at install as an opaque "Unable to Install"'; fail=1; }

          point_id=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$point_id" = "com.apple.usernotifications.service" ] \
            || { echo "::error::NSExtensionPointIdentifier is '$point_id', not com.apple.usernotifications.service"; fail=1; }

          principal=$(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$principal" = "MailVerdictNotify.NotificationService" ] \
            || { echo "::error::NSExtensionPrincipalClass is '$principal', not MailVerdictNotify.NotificationService"; fail=1; }

          appex_id=$(plutil -extract CFBundleIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$appex_id" = "com.frederikberg.mailverdict.notify" ] \
            || { echo "::error::appex CFBundleIdentifier is '$appex_id', not com.frederikberg.mailverdict.notify"; fail=1; }

          app_short=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist" 2>/dev/null || echo "")
          app_build=$(plutil -extract CFBundleVersion raw "$app/Info.plist" 2>/dev/null || echo "")
          appex_short=$(plutil -extract CFBundleShortVersionString raw "$appex/Info.plist" 2>/dev/null || echo "")
          appex_build=$(plutil -extract CFBundleVersion raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$app_short" = "$appex_short" ] && [ "$app_build" = "$appex_build" ] \
            || { echo "::error::version mismatch: app ${app_short}/${app_build} vs appex ${appex_short}/${appex_build} — App Store Connect rejects this"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            cat /tmp/appex-info.txt
            exit 1
          fi
          echo 'appex Info.plist checks out'

          # The memory-budget guard: the extension links PushEnvelope only, never the much larger
          # SwiftSoup (the reader's own dependency) — an extension process has a tight memory cap.
          binary="$appex/MailVerdictNotify"
          if [ -f "$binary" ] && nm "$binary" 2>/dev/null | grep -q SwiftSoup; then
            echo '::error::MailVerdictNotify links SwiftSoup — it should depend on PushEnvelope only'
            exit 1
          fi

      # The share extension: the same install-time traps as the notification extension, plus the
      # activation rule — without one the app never appears in the share sheet, with no error.
      - name: The share extension is embedded and declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          appex="$app/PlugIns/MailVerdictShare.appex"
          [ -d "$appex" ] \
            || { echo '::error::MailVerdictShare.appex is not embedded in PlugIns/ — check the copy phase and the target dependency'; exit 1; }

          plutil -p "$appex/Info.plist" > /tmp/share-info.txt
          fail=0

          display_name=$(plutil -extract CFBundleDisplayName raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ -n "$display_name" ] \
            || { echo '::error::MailVerdictShare CFBundleDisplayName is empty — fails at install as an opaque "Unable to Install"'; fail=1; }

          point_id=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$point_id" = "com.apple.share-services" ] \
            || { echo "::error::NSExtensionPointIdentifier is '$point_id', not com.apple.share-services"; fail=1; }

          principal=$(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$principal" = "MailVerdictShare.ShareViewController" ] \
            || { echo "::error::NSExtensionPrincipalClass is '$principal', not MailVerdictShare.ShareViewController"; fail=1; }

          grep -q 'NSExtensionActivationSupportsFileWithMaxCount' /tmp/share-info.txt \
            || { echo '::error::the share extension has no file activation rule — MailVerdict would never show in the share sheet'; fail=1; }
          grep -q 'NSExtensionActivationSupportsImageWithMaxCount' /tmp/share-info.txt \
            || { echo '::error::the share extension has no image activation rule'; fail=1; }

          appex_id=$(plutil -extract CFBundleIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$appex_id" = "com.frederikberg.mailverdict.share" ] \
            || { echo "::error::appex CFBundleIdentifier is '$appex_id', not com.frederikberg.mailverdict.share"; fail=1; }

          app_short=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist" 2>/dev/null || echo "")
          app_build=$(plutil -extract CFBundleVersion raw "$app/Info.plist" 2>/dev/null || echo "")
          appex_short=$(plutil -extract CFBundleShortVersionString raw "$appex/Info.plist" 2>/dev/null || echo "")
          appex_build=$(plutil -extract CFBundleVersion raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$app_short" = "$appex_short" ] && [ "$app_build" = "$appex_build" ] \
            || { echo "::error::version mismatch: app ${app_short}/${app_build} vs appex ${appex_short}/${appex_build} — App Store Connect rejects this"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            cat /tmp/share-info.txt
            exit 1
          fi
          echo 'share appex Info.plist checks out'

      # `inputs` is empty on pull_request, and an expression compares null equal to false, so the
      # guard names the event rather than testing `inputs.run_app != false`.
      - name: Wait for the simulator
        if: inputs.run_app
        env:
          APPEARANCE: ${{ inputs.appearance }}
        run: Tooling/sim/boot.sh wait "${{ steps.sim.outputs.udid }}"

      - name: Install the app
        if: inputs.run_app
        run: Tooling/sim/install.sh "${{ steps.sim.outputs.udid }}" build/dd

      - name: Fixture-mode screenshot sweep
        if: inputs.run_app && (inputs.configuration || 'Debug') == 'Debug'
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          ONLY: ${{ inputs.only }}
          PROBE: ${{ inputs.script }}
          CONTENT_SIZE: ${{ inputs.content_size }}
        run: Tooling/sim/sweep.sh

      # No debug bridge in Release — this is the plain "does it draw anything" check the Debug
      # path above replaces with a bridge-verified one.
      - name: Screenshot the running app
        if: inputs.run_app && (inputs.configuration || 'Debug') == 'Release'
        run: |
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$udid" com.frederikberg.mailverdict
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/screen.png
          bytes=$(stat -f %z artifacts/screen.png)
          echo "screenshot is $bytes bytes"
          [ "$bytes" -gt 20000 ] || { echo 'suspiciously small — the screen may be blank'; exit 1; }

      - name: Application logs
        if: always() && inputs.run_app
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 3m --style compact \
            --predicate 'processImagePath CONTAINS "MailVerdict"' > artifacts/app.log 2>&1 || true

      # `log show`'s own predicate never includes a crash — a crashed process stops logging,
      # it doesn't log its own crash — so a dead-on-launch screen otherwise leaves nothing in
      # app.log to explain it. A simulator app crashes into the HOST's own DiagnosticReports,
      # not anywhere inside the simulator, because it runs as a host process.
      - name: Collect crash reports
        if: always() && inputs.run_app
        run: |
          mkdir -p artifacts/crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname '*MailVerdict*' \
            -newer /tmp/mac-sweep-start-marker -exec cp {} artifacts/crashes/ \; 2>/dev/null || true
          count=$(find artifacts/crashes -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "collected ${count} crash report file(s)"

      - uses: actions/upload-artifact@v7
        if: always() && inputs.run_app
        with:
          name: mac-artifacts
          path: artifacts/
          retention-days: 14
