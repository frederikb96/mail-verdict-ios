name: Mac

# Everything that genuinely needs Apple hardware — building the app target, and running it in a
# simulator to see what it draws.
#
# 🚨 **Not triggered by pushes to main, deliberately.** A Mac run takes ten to thirty minutes and
# queues for a scarcer machine, so firing one on every commit buries the answer you wanted under
# twenty you did not. Work on a branch, then ask for one run when there is something worth
# looking at — `gh workflow run mac.yml` — or open a pull request. Batch the questions into that
# one run rather than spending several to answer them one at a time.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_app:
        description: 'Boot a simulator and run the app (slower; skip for a compile-only check)'
        type: boolean
        default: true
      configuration:
        description: 'Build configuration. Release before a release — DEBUG-only code compiles out, and that error surfaces nowhere else.'
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('MailVerdictKit/Package.swift', 'MailVerdict.xcodeproj/project.pbxproj') }}
          restore-keys: dd-${{ runner.os }}-

      # Everything else in the package is already green from free-checks, so this builds only the
      # app target — the part that needs an iOS SDK.
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project MailVerdict.xcodeproj -scheme MailVerdict \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log | tail -20

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # Catches a dropped `INFOPLIST_FILE` merge or a missing `ASSETCATALOG_COMPILER_APPICON_NAME`
      # before either ships: both fail silently on a device rather than at build time, so asserting
      # against the actual built bundle is the only way to know.
      - name: The built bundle declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          plutil -p "$app/Info.plist" > /tmp/built-info.txt
          grep -q '"CFBundleIconName"' /tmp/built-info.txt \
            || { echo '::error::CFBundleIconName is missing — ASSETCATALOG_COMPILER_APPICON_NAME or the asset catalog is wrong'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'ITSAppUsesNonExemptEncryption' /tmp/built-info.txt \
            || { echo '::error::ITSAppUsesNonExemptEncryption is missing — a submission would otherwise be asked about export compliance every time'; \
                 cat /tmp/built-info.txt; exit 1; }
          echo 'app icon and encryption declaration both present'

      # The extension is a separate target, embedded by its own copy phase — a dropped embed, a
      # mismatched version or an empty CFBundleDisplayName all install as an opaque "Unable to
      # Install" on the phone, with no build-time error otherwise.
      - name: The notification extension is embedded and declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          appex="$app/PlugIns/MailVerdictNotify.appex"
          [ -d "$appex" ] \
            || { echo '::error::MailVerdictNotify.appex is not embedded in PlugIns/ — check the copy phase and the target dependency'; exit 1; }

          grep -q 'UIBackgroundModes' /tmp/built-info.txt \
            || { echo '::error::app Info.plist has no UIBackgroundModes — silent pushes never reach the app'; cat /tmp/built-info.txt; exit 1; }
          grep -q 'remote-notification' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes does not contain remote-notification'; cat /tmp/built-info.txt; exit 1; }

          plutil -p "$appex/Info.plist" > /tmp/appex-info.txt
          fail=0

          display_name=$(plutil -extract CFBundleDisplayName raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ -n "$display_name" ] \
            || { echo '::error::MailVerdictNotify CFBundleDisplayName is empty — fails at install as an opaque "Unable to Install"'; fail=1; }

          point_id=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$point_id" = "com.apple.usernotifications.service" ] \
            || { echo "::error::NSExtensionPointIdentifier is '$point_id', not com.apple.usernotifications.service"; fail=1; }

          principal=$(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$principal" = "MailVerdictNotify.NotificationService" ] \
            || { echo "::error::NSExtensionPrincipalClass is '$principal', not MailVerdictNotify.NotificationService"; fail=1; }

          appex_id=$(plutil -extract CFBundleIdentifier raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$appex_id" = "com.frederikberg.mailverdict.notify" ] \
            || { echo "::error::appex CFBundleIdentifier is '$appex_id', not com.frederikberg.mailverdict.notify"; fail=1; }

          app_short=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist" 2>/dev/null || echo "")
          app_build=$(plutil -extract CFBundleVersion raw "$app/Info.plist" 2>/dev/null || echo "")
          appex_short=$(plutil -extract CFBundleShortVersionString raw "$appex/Info.plist" 2>/dev/null || echo "")
          appex_build=$(plutil -extract CFBundleVersion raw "$appex/Info.plist" 2>/dev/null || echo "")
          [ "$app_short" = "$appex_short" ] && [ "$app_build" = "$appex_build" ] \
            || { echo "::error::version mismatch: app ${app_short}/${app_build} vs appex ${appex_short}/${appex_build} — App Store Connect rejects this"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            cat /tmp/appex-info.txt
            exit 1
          fi
          echo 'appex Info.plist checks out'

          # The memory-budget guard: the extension links PushEnvelope only, never the much larger
          # SwiftSoup (the reader's own dependency) — an extension process has a tight memory cap.
          binary="$appex/MailVerdictNotify"
          if [ -f "$binary" ] && nm "$binary" 2>/dev/null | grep -q SwiftSoup; then
            echo '::error::MailVerdictNotify links SwiftSoup — it should depend on PushEnvelope only'
            exit 1
          fi

      - name: Boot a simulator
        id: sim
        if: inputs.run_app != false
        run: |
          # Chosen from what the image actually has: runner images change their device list
          # between releases, and a hardcoded name fails late and confusingly.
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices[runtime]:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); raise SystemExit
          ")
          [ -n "$udid" ] || { echo 'no iPhone simulator available'; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark

          # The keyboard's one-time "slide to type" introduction covers the bottom third of the
          # screen the first time a text field is focused — exactly where search-with-results'
          # own results sit. Suppressing it here, once, at boot, is what keeps every later
          # screenshot from depending on whether this is the simulator's first keyboard focus.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true

          # A reference point for "Collect crash reports" below, rather than a literal date —
          # `find -newermt` takes a parseable date string on Linux's GNU find but nothing this
          # portable on the runner's own BSD one, and a timestamp this job minted is already
          # exactly the boundary that matters.
          touch /tmp/mac-sweep-start-marker

      - name: Install the app
        if: inputs.run_app != false
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          xcrun simctl install "$udid" "$app"

      # The debug bridge and its routes are `#if DEBUG`, so this only runs for Debug. A plain,
      # non-fixture launch — this is the sign-in screen by design (no Keychain credential exists
      # on a fresh simulator), proof the real (non-fixture) launch path still reaches it.
      - name: Launch and ask the debug bridge what it thinks
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Debug'
        run: |
          set -o pipefail
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          bundle=com.frederikberg.mailverdict
          fail=0

          xcrun simctl launch "$udid" "$bundle" > /dev/null
          ok=0
          for attempt in $(seq 1 10); do
            if curl -sS --max-time 3 "http://127.0.0.1:8765/health" -o artifacts/health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::debug bridge never answered"
            fail=1
          fi
          curl -sS --max-time 3 "http://127.0.0.1:8765/routes" -o artifacts/routes.json || true

          # The bridge starts listening before the first frame is drawn, so "/health answered"
          # proves the process is alive and proves nothing about the screen. Settle before the
          # screenshot, same reasoning as every other screenshot workflow in this family.
          sleep 6
          xcrun simctl io "$udid" screenshot artifacts/screen-root.png
          bytes=$(stat -f %z artifacts/screen-root.png)
          echo "root: ${bytes} bytes"
          if [ "$bytes" -le 20000 ]; then
            echo "::warning::screenshot suspiciously small — the screen may be blank"
            fail=1
          fi
          curl -sS --max-time 3 "http://127.0.0.1:8765/logs?level=info&limit=200" \
            -o artifacts/logs.json || true
          xcrun simctl terminate "$udid" "$bundle" || true

          [ "$fail" -eq 0 ] || { echo 'one or more checks failed — see the warnings above'; exit 1; }

      # Every registered screen, captured by name. `-MVFixtureMode YES` connects to the fixture
      # backend and skips sign-in straight into the shell (no network, no real credential); a
      # second relaunch per id adds `-MVFixtureScreen <id>`, which the app reads to navigate
      # there itself. `/screen/current` is set by the destination screen's own body once it has
      # genuinely appeared (never by this workflow, and never by the app's own launcher) — so
      # polling it rather than sleeping-and-hoping is what catches a screen that silently never
      # rendered (a sign-in gate fixture mode failed to skip, a crash, a broken route) as a
      # failure instead of a screenshot of the wrong thing.
      - name: Fixture-mode screenshot sweep
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Debug'
        run: |
          set -o pipefail
          mkdir -p artifacts artifacts/logs
          udid="${{ steps.sim.outputs.udid }}"
          bundle=com.frederikberg.mailverdict
          fail=0

          # `simctl terminate` returns once the request is issued, not once the process and its
          # debug-bridge listener are actually gone — relaunching before that finishes risks the
          # new launch racing the old process, which is what let one screen's `/fixtures/misses`
          # carry the previous screen's own still-in-flight requests. Both signals have to clear:
          # the process itself (`launchctl list`) and the port it was listening on (refused, not
          # merely timed out, is what "nothing is there" looks like).
          terminate_and_wait() {
            xcrun simctl terminate "$udid" "$bundle" || true
            for attempt in $(seq 1 10); do
              if ! xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "$bundle" \
                && ! curl -sS --max-time 1 "http://127.0.0.1:8765/health" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "::warning::old process or its debug bridge had not gone away after 10s"
          }

          terminate_and_wait
          xcrun simctl launch "$udid" "$bundle" -MVFixtureMode YES > /dev/null

          ok=0
          for attempt in $(seq 1 10); do
            if curl -sS --max-time 3 "http://127.0.0.1:8765/screens" -o artifacts/screens.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::debug bridge never answered /screens in fixture mode"
            terminate_and_wait
            exit 1
          fi

          # A plain `while read` rather than `mapfile` — the macOS runner's default `/bin/bash`
          # is the ancient Apple-shipped 3.2, which does not have `mapfile` (bash 4+ only).
          ids_list=$(python3 -c "import json; print('\n'.join(json.load(open('artifacts/screens.json'))['screens']))")
          terminate_and_wait

          if [ -z "$ids_list" ]; then
            echo "no registered screenshot ids yet — nothing to sweep"
          fi

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            # A fresh process starts this ring empty anyway, but `since` is what keeps this
            # screen's own dump from also carrying the previous screen's entries if its process
            # (and bridge) were not entirely gone by the time this one launched.
            since=$(date -u +%s)
            xcrun simctl launch "$udid" "$bundle" -MVFixtureMode YES -MVFixtureScreen "$id" > /dev/null

            reached=0
            for attempt in $(seq 1 15); do
              current=$(curl -sS --max-time 3 "http://127.0.0.1:8765/screen/current" 2>/dev/null \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || echo "")
              if [ "$current" = "$id" ]; then
                reached=1
                break
              fi
              sleep 2
            done

            if [ "$reached" -ne 1 ]; then
              echo "::error::screen '$id' never reported ready on /screen/current"
              # The debug bridge never answering again is exactly what a dead process looks
              # like too — `launchctl list` is what actually distinguishes "still starting up
              # slowly" from "crashed and gone", rather than leaving that to be guessed from the
              # device log, which carries nothing about a crash at all.
              if ! xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "$bundle"; then
                echo "screen $id: app crashed"
              fi
              # Whatever is actually on screen when a screen fails to settle, captured anyway —
              # and whether the main actor itself ever answers tells "pushed but its view never
              # appeared" apart from "nothing will ever appear, the main actor is stuck", which a
              # bridge route answering from its own queue (every other one here) cannot.
              xcrun simctl io "$udid" screenshot "artifacts/screen-$id-notready.png" || true
              probe=$(curl -sS --max-time 3 "http://127.0.0.1:8765/main-actor-probe" 2>/dev/null || echo "")
              if [ -n "$probe" ]; then
                echo "screen $id: main-actor-probe answered: $probe"
              else
                echo "screen $id: main-actor-probe did not answer within 3s — main actor may be stuck"
              fi
              fail=1
            else
              xcrun simctl io "$udid" screenshot "artifacts/screen-$id.png"
              bytes=$(stat -f %z "artifacts/screen-$id.png")
              echo "$id: ${bytes} bytes"
              if [ "$bytes" -le 20000 ]; then
                echo "::warning::screenshot for '$id' suspiciously small — the screen may be blank"
                fail=1
              fi

              # A screen that silently fell back to an error state instead of its fixture still
              # "succeeds" the two checks above — this is what actually proves every request it
              # made was answered by the table rather than reaching the real network.
              misses=$(curl -sS --max-time 3 "http://127.0.0.1:8765/fixtures/misses" 2>/dev/null \
                | python3 -c "import json,sys; print(','.join(json.load(sys.stdin).get('misses') or []))" 2>/dev/null || echo "")
              if [ -n "$misses" ]; then
                echo "::error::screen '$id' hit request(s) no fixture route answered: $misses"
                fail=1
              fi
            fi

            # Before terminate_and_wait, which is what makes this the last chance to ask this
            # screen's own process anything — /logs was otherwise only ever read once, before
            # this loop even starts, so no feature's own debug markers reached the artifacts for
            # any individual screen, success or failure alike.
            curl -sS --max-time 3 "http://127.0.0.1:8765/logs?since=$since&limit=500" \
              -o "artifacts/logs/$id.json" 2>/dev/null || true
            terminate_and_wait
          done <<< "$ids_list"

          [ "$fail" -eq 0 ] || { echo 'one or more fixture screenshots failed — see above'; exit 1; }

      # No debug bridge in Release — this is the plain "does it draw anything" check the Debug
      # path above replaces with a bridge-verified one.
      - name: Screenshot the running app
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Release'
        run: |
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$udid" com.frederikberg.mailverdict
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/screen.png
          bytes=$(stat -f %z artifacts/screen.png)
          echo "screenshot is $bytes bytes"
          [ "$bytes" -gt 20000 ] || { echo 'suspiciously small — the screen may be blank'; exit 1; }

      - name: Application logs
        if: always() && inputs.run_app != false
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 3m --style compact \
            --predicate 'processImagePath CONTAINS "MailVerdict"' > artifacts/app.log 2>&1 || true

      # `log show`'s own predicate never includes a crash — a crashed process stops logging,
      # it doesn't log its own crash — so a dead-on-launch screen otherwise leaves nothing in
      # app.log to explain it. A simulator app crashes into the HOST's own DiagnosticReports,
      # not anywhere inside the simulator, because it runs as a host process.
      - name: Collect crash reports
        if: always() && inputs.run_app != false
        run: |
          mkdir -p artifacts/crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname '*MailVerdict*' \
            -newer /tmp/mac-sweep-start-marker -exec cp {} artifacts/crashes/ \; 2>/dev/null || true
          count=$(find artifacts/crashes -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "collected ${count} crash report file(s)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-artifacts
          path: artifacts/
          retention-days: 14
